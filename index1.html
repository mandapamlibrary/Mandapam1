html<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<title>பருவ இதழ்கள் - ராமநாதபுரம்</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--blue:#0f4c81}
body{margin:0;font-family:sans-serif;background:#eef3ff}
.topbar{background:var(--blue);color:white;padding:12px;text-align:center}
.card{max-width:1100px;margin:15px auto;background:white;border-radius:10px;padding:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.login-card{max-width:400px;margin:50px auto}
input,select{padding:9px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{padding:9px 14px;background:var(--blue);color:white;border:none;border-radius:6px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{border:1px solid #ddd;padding:8px;font-size:13px}
th{background:#f1f5f9}
.badge{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:bold}
.Arrived{background:#dcfce7;color:#166534} .NotArrived{background:#fee2e2;color:#991b1b} .Arrear{background:#ffedd5;color:#9a3412}
</style>
</head>
<body>
<div class="topbar">
<h3 style="margin:0">பருவ இதழ்கள் தொகை செலுத்துதல் - மாவட்ட நூலக அலுவலகம், இராமநாதபுரம்</h3>
</div>

<div id="loginDiv" class="card login-card">
<h3 style="text-align:center;color:var(--blue)">User Login</h3>
<input id="u" placeholder="Username: admin" style="width:100%">
<input id="p" type="password" placeholder="Password: rmd123" style="width:100%">
<button style="width:100%;margin-top:8px" onclick="login()">Login</button>
<p style="font-size:12px;text-align:center">admin / rmd123</p>
</div>

<div id="appDiv" style="display:none">
<div class="card">
<h4>நூலகங்கள் - Arrived / Not Arrived</h4>
<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
<input id="search" placeholder="Search..." onkeyup="render()" style="width:200px">
<select id="fStatus" onchange="render()" style="width:150px"><option value="All">All Status</option><option>Arrived</option><option>Not Arrived</option><option>Arrear</option></select>
<button style="background:#16a34a" onclick="exportExcel()">Excel Download</button>
<button onclick="addNew()">+ புதிய நூலகம் சேர்க்க</button>
</div>

<table><thead><tr><th>வ.எண்</th><th>நூலக வகை</th><th>நூலகம் / ஊர்</th><th>தேதி</th><th>Status</th><th>மாற்று</th></tr></thead><tbody id="tbody"></tbody></table>
</div>
</div>

<script>
let defaultData = [
  {id:1, type:'கிளை நூலகம்', name:'கிளை நூலகம் பாம்பன்', date:new Date().toISOString().split('T')[0], status:'Not Arrived'},
  {id:2, type:'கிளை நூலகம்', name:'கிளை நூலகம் தங்கச்சி மடம்', date:new Date().toISOString().split('T')[0], status:'Not Arrived'},
  {id:3, type:'கிளை நூலகம்', name:'கிளை நூலகம் மண்டபம்', date:new Date().toISOString().split('T')[0], status:'Not Arrived'},
  {id:4, type:'கிளை நூலகம்', name:'கிளை நூலகம் என்மனம்கொண்டான்', date:new Date().toISOString().split('T')[0], status:'Not Arrived'}
];

let data = JSON.parse(localStorage.getItem('rmd_final')||'null');
if(!data){ data = defaultData; localStorage.setItem('rmd_final', JSON.stringify(data)); }

function login(){ if(u.value==='admin'&&p.value==='rmd123'){ loginDiv.style.display='none'; appDiv.style.display='block'; render(); } else alert('admin / rmd123'); }

function render(){
 let s=search.value.toLowerCase(), fs=fStatus.value;
 let f=data.filter(m=> (m.name.toLowerCase().includes(s)) && (fs==='All'||m.status===fs));
 tbody.innerHTML=f.map((m,i)=>`<tr><td>${i+1}</td><td>${m.type}</td><td>${m.name}</td><td>${m.date}</td><td><span class="badge ${m.status.replace(' ','')}">${m.status}</span></td><td><button onclick="toggle(${m.id})">Change to ${m.status==='Arrived'?'Not Arrived':'Arrived'}</button></td></tr>`).join('');
}

function toggle(id){
 let m=data.find(x=>x.id===id);
 m.status = m.status==='Arrived' ? 'Not Arrived' : m.status==='Not Arrived' ? 'Arrear' : 'Arrived';
 localStorage.setItem('rmd_final', JSON.stringify(data));
 render();
}

function addNew(){
 let name = prompt('புதிய நூலகத்தின் பெயரை எழுதவும்: உதா: கிளை நூலகம் ராமேஸ்வரம்');
 if(!name) return;
 data.unshift({id:Date.now(), type:'கிளை நூலகம்', name:name, date:new Date().toISOString().split('T')[0], status:'Not Arrived'});
 localStorage.setItem('rmd_final', JSON.stringify(data));
 render();
}

function exportExcel(){
 let ws=XLSX.utils.json_to_sheet(data);
 let wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,'RMD');
 XLSX.writeFile(wb,'Ramanathapuram_Library_'+new Date().toISOString().split('T')[0]+'.xlsx');
}
</script>
</body>
</html>
